name: malina
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1

  # Networking
  dio: ^5.9.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.1

  # Code Generation
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  get_it: ^8.2.0
  equatable: ^2.0.7
  go_router: ^16.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
